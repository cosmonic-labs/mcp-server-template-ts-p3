apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: Workload
metadata:
  name: mcp-off-shelf
  namespace: default
  # MCP catalog metadata used by Cosmonic Desktop.
  labels:
    app.kubernetes.io/name: mcp-off-shelf
    app.kubernetes.io/version: 0.1.0
    mcp.ai/auth-type: none
    mcp.ai/domain: template
    mcp.ai/function-type: tools
    mcp.ai/skills: "true"
    mcp.ai/spec-version: "2026-07-28"
    mcp.ai/statefulness: stateless
    mcp.ai/transport: streamable-http
  annotations:
    desktop.cosmonic.com/source: mcp
spec:
  hostInterfaces:
    - namespace: wasi
      package: http
      interfaces:
        - handler
      config:
        host: mcp-off-shelf.localhost
  components:
    - name: mcp
      # Use the digest-pinned image returned by promote.
      image: oci-registry.localhost:8200/mcp-off-shelf:0.1.0
      poolSize: 1
      maxInvocations: 0
      localResources:
        environment:
          config:
            MCP_LOG_LEVEL: info
            MCP_ALLOWED_HOSTS: mcp-off-shelf.localhost
            MCP_OUTBOUND_TIMEOUT_MS: "30000"
            MCP_OUTBOUND_MAX_BYTES: "4194304"
        allowedHosts: []
